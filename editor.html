<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

<title>Anna Editor</title>
<link rel="stylesheet" href="style.css">

</head>


<body>


<img class="anna-logo" src="icons/anna-logo.png" alt="Anna Deng Photography">
<h2>Welcome back, Anna!</h2>

<div class="editor-layout">

<div class="editor-sidebar">



<div class="create-section">

<button class="create-album-button" onclick="openCreateAlbum()">

<img src="icons/create-album.png">

<span>Create Album</span>

</button>

</div>
<button class="notifications-button" onclick="openNotifications()">

<img id="notificationIcon" src="icons/notification.png">

<span>Notifications</span>

</button>
<div class="storage-card">

<div class="storage-title">

<img src="icons/cloud">

<span>Storage</span>

</div>


<div class="storage-bar">

<div id="storageUsed"></div>

</div>


<p id="storageText">
0 GB of 10 GB used
</p>


</div>
<button class="logout-button" onclick="logout()">
Logout
</button>


</div>


<div class="albums" id="albums">

</div>

</div>
  <div id="snackbar"></div>
  <div id="createAlbumOverlay" class="confirm-overlay">

<div class="confirm-dialog">

<h3>Create New Album</h3>

<input 
id="newAlbumName"
placeholder="English album name"
autocomplete="off"
oninput="checkCreateName()"
>

<input 
id="newAlbumChinese"
placeholder="中文名称（可选）"
autocomplete="off"
>
<p id="createNameError" class="name-error"></p>
<div class="confirm-buttons">

<button class="success-button" onclick="createAlbum()">
Create
</button>
<button onclick="closeCreateAlbum()">
Cancel
</button>

</div>

</div>

</div>
  <div id="renameBox" class="confirm-overlay">

<div class="confirm-dialog">

<h3>Rename Album</h3>

<input 
id="renameAlbumName" 
placeholder="English album name"
autocomplete="off"
oninput="checkRenameName()"
>

<input 
id="renameAlbumChinese"
placeholder="中文名称"
autocomplete="off"
> <p id="renameNameError" class="name-error"></p>
<div class="confirm-buttons">

<button class="success-button" onclick="confirmRename()">
Rename
</button>
<button onclick="closeRename()">
Cancel
</button>

</div>

</div>

</div>
  <div id="confirmBox" class="confirm-overlay">

<div class="confirm-dialog">

<h3 id="confirmText"></h3>

<div class="confirm-buttons">

<button class="danger-button" onclick="confirmYes()">
Delete
</button>

<button onclick="confirmNo()">
Cancel
</button>

</div>

</div>

</div>
<div id="albumMenu" class="popup-menu"></div>
  <div id="notificationOverlay" class="confirm-overlay">

<div class="confirm-dialog notification-dialog">

<h3>Notifications</h3>

<div id="notificationList">

Loading...

</div>


<div class="confirm-buttons">

<button onclick="closeNotifications()">
Close
</button>

</div>


</div>

</div>
<script>
  const password =
localStorage.getItem("annaEditorPassword");

if (!password) {

window.location.href =
"manage.html";

}


const workerURL =
"https://anna-photo-gallery.anna-deng.workers.dev";
  const r2URL =
"https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/";
  async function loadStorage(){

const response =
await fetch(workerURL + "?storage=true");


const data =
await response.json();


const usedGB =
data.used / (1024*1024*1024);


const percent =
(usedGB / 10) * 100;


document.getElementById("storageUsed").style.width =
percent + "%";


document.getElementById("storageText").innerHTML =
usedGB.toFixed(2) +
" GB of 10 GB used";

}


async function loadAlbums(){


const response =
await fetch(workerURL + "?albums=true");


const albums =
await response.json();



const container =
document.getElementById("albums");



for (const album of albums) {
  const photoResponse =
await fetch(
workerURL +
"?album=" +
encodeURIComponent(album.name)
);


const photos =
await photoResponse.json();


const photoCount =
photos.filter(photo => !photo.endsWith("/")).length;

const div =
document.createElement("div");

div.className =
"album";

div.draggable = true;


const image =
album.cover
?
"https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/" +
album.cover.split("/")
.map(encodeURIComponent)
.join("/")
:
"icons/empty-album.png";


div.innerHTML = `

<div class="album-card">

<a class="album-link"
href="edit-album.html?album=${encodeURIComponent(album.name)}">

<img src="${image}">

<h3 class="album-title">${album.name}</h3>

<p class="album-info">
${photoCount} photos &#8226; ${album.public ? "Public" : "Private"}</p>
</a>




<button 
class="album-menu-button"
onclick="albumMenu(event, '${album.name}')">

&#8942;

</button>

</div>
`;  container.appendChild(div);
div.addEventListener("dragstart",()=>{
div.classList.add("dragging");
});


div.addEventListener("dragend",()=>{

div.classList.remove("dragging");

saveAlbumOrder();

});

}


}



function logout(){

localStorage.removeItem(
"annaEditorPassword"
);

window.location.href =
"manage.html";

}

  function editAlbum(name){

window.location.href =
"edit-album.html?album=" +
encodeURIComponent(name);

}
  function openCreateAlbum(){

document.getElementById("createAlbumOverlay").style.display="flex";

}


function closeCreateAlbum(){

document.getElementById("createAlbumOverlay").style.display="none";

}
async function createAlbum(){


const name =
document.getElementById("newAlbumName").value.trim();
  const chinese =
document.getElementById("newAlbumChinese").value.trim();


if(!name){

showSnackbar("Enter album name");
return;

}
  if(!chinese){

showSnackbar("Enter Chinese album name");
return;

}

if(
existingAlbums.some(
album => album.name.toLowerCase() === name.toLowerCase()
)
){

document.getElementById("createNameError").innerHTML =
"This album name already exists.";

return;

}

const password =
localStorage.getItem("annaEditorPassword");



const response =
await fetch(
workerURL + "/create-album",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({
name:name,
chinese:chinese
})
}
);



const result =
await response.json();



if(result.success){

window.location.href =
"edit-album.html?album=" +
encodeURIComponent(name);

}
else{

showSnackbar(result.error);

}


}
function showSnackbar(message){

const bar =
document.getElementById("snackbar");

bar.innerHTML = message;

bar.classList.add("show");

setTimeout(function(){

bar.classList.remove("show");

},3000);

}
  let confirmAction = null;


function showConfirm(message, action){

document.getElementById("confirmText").innerHTML =
message;

confirmAction = action;

document.getElementById("confirmBox").style.display =
"flex";

}


function confirmYes(){

document.getElementById("confirmBox").style.display =
"none";

if(confirmAction){

confirmAction();

}

confirmAction = null;

}


function confirmNo(){

document.getElementById("confirmBox").style.display =
"none";

confirmAction = null;

}
  let currentAlbum = null;


let renameOldName = "";
let existingAlbums = [];


async function getExistingAlbums(){

const response =
await fetch(workerURL + "?albums=true");

existingAlbums =
await response.json();

}


function checkCreateName(){

const input =
document.getElementById("newAlbumName");

const error =
document.getElementById("createNameError");


const name =
input.value.trim();


if(
existingAlbums.some(
album => album.name.toLowerCase() === name.toLowerCase()
)
){

error.innerHTML =
"This album name already exists.";

}
else{

error.innerHTML =
"";

}

}



function checkRenameName(){

const input =
document.getElementById("renameAlbumName");

const error =
document.getElementById("renameNameError");


const name =
input.value.trim();


if(
existingAlbums.some(
album =>
album.name.toLowerCase() === name.toLowerCase()
&& album.name !== renameOldName
)
){

error.innerHTML =
"This album name already exists.";

}
else{

error.innerHTML =
"";

}

}

async function renameAlbum(name){

renameOldName = name;

document.getElementById("renameAlbumName").value = name;


// get current album info
const response =
await fetch(
workerURL + "?albums=true"
);

const albums =
await response.json();


const album =
albums.find(a => a.name === name);


document.getElementById("renameAlbumChinese").value =
album && album.chinese
? album.chinese
: "";


document.getElementById("renameBox").style.display = "flex";

}function closeRename(){

document.getElementById("renameBox").style.display = "none";

}


function confirmRename(){

const newName =
document.getElementById("renameAlbumName").value.trim();
  const chinese =
document.getElementById("renameAlbumChinese").value.trim();
  
if(
existingAlbums.some(
album =>
album.name.toLowerCase() === newName.toLowerCase()
&& album.name !== renameOldName
)
){

document.getElementById("renameNameError").innerHTML =
"This album name already exists.";

return;

}

if(!newName){

showSnackbar("Enter new album name");
return;

}
  
if(!chinese){

showSnackbar("Enter Chinese album name");
return;

}

if(newName === renameOldName){

closeRename();
return;

}


closeRename();


renameAlbumRequest(
renameOldName,
newName,
chinese
);
}
async function renameAlbumRequest(oldName,newName,chinese){

const password =
localStorage.getItem("annaEditorPassword");


const response =
await fetch(
workerURL + "/rename-album",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({

oldName:oldName,

newName:newName,

chinese:chinese

})

}
);


const result =
await response.json();


if(result.success){

showSnackbar("Album renamed");


setTimeout(()=>{

location.reload();

},800);


}
else{

showSnackbar(result.error);

}


}



function deleteAlbum(name){

showConfirm(
"Are you sure you want to delete " + name + "?<br><br>This cannot be undone.",
function(){

performDeleteAlbum(name);

}
);

}
async function performDeleteAlbum(name){


const password =
localStorage.getItem("annaEditorPassword");


const response =
await fetch(
workerURL + "/delete-album",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({

album:name

})

}
);


const result =
await response.json();


if(result.success){

showSnackbar("Album deleted");


setTimeout(()=>{

location.reload();

},1000);


}

else{

showSnackbar(result.error);

}

}
  function albumMenu(e, name){

e.preventDefault();
e.stopPropagation();

const menu =
document.getElementById("albumMenu");

menu.innerHTML = `

<button onclick="deleteAlbum('${name}')">
Delete Album
</button>

<button onclick="renameAlbum('${name}')">
Rename Album
</button>

`;

menu.style.display="block";
menu.style.position="fixed";
menu.style.top =
(e.clientY + 10) + "px";

menu.style.left =
(e.clientX - 180) + "px";

}
  document.addEventListener(
"click",
function(e){

const menu =
document.getElementById("albumMenu");


if(
menu.style.display === "block" &&
!menu.contains(e.target)
){

menu.style.display="none";

}

}
);
  function saveAlbumOrder(){

const albums =
[...document.querySelectorAll(".album")]
.map(x =>
x.querySelector("h3").innerText
);


fetch(
workerURL + "?albumOrder=true",
{

method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":
localStorage.getItem("annaEditorPassword")
},

body:JSON.stringify({
order:albums
})

});


}
  async function togglePublic(albumName, value){

const password =
localStorage.getItem("annaEditorPassword");


await fetch(
workerURL + "/set-public",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({

album:albumName,

public:value

})

}
);


showSnackbar(
value
? "Album is now public"
: "Album is now private"
);


}
  async function updateNotificationIcon(){

const response =
await fetch(
workerURL + "/get-notifications"
);


const notifications =
await response.json();


const icon =
document.getElementById("notificationIcon");


if(!icon) return;


const hasNew =
notifications.some(
n => !n.seen
);


if(hasNew){

icon.src =
"icons/new-notification.png";

}
else{

icon.src =
"icons/notification.png";

}

}
  function formatNotificationDate(time){

const d = new Date(time);


return (

d.getDate()
+
" "
+
d.toLocaleString("en-US",{month:"long"})
+
" "
+
d.getFullYear()
+
" "
+
d.toLocaleTimeString("en-US")

);

}
  async function openNotifications(){

document.getElementById(
"notificationOverlay"
).style.display="flex";


loadNotifications();
    updateNotificationIcon();

}



function closeNotifications(){

document.getElementById(
"notificationOverlay"
).style.display="none";

}



async function loadNotifications(){


const box =
document.getElementById(
"notificationList"
);


const response =
await fetch(
workerURL +
"/get-notifications"
);


const notifications =
await response.json();



if(notifications.length===0){

box.innerHTML =
"No notifications.";

return;

}


box.innerHTML="";



notifications.forEach(n=>{

const div =
document.createElement("div");


div.className =
n.seen
?
"notification seen"
:
"notification new";



if(n.type==="like"){


div.innerHTML = `

<div class="notification-main">

<img class="notification-icon"
src="icons/red-heart.png">


<span class="notification-text">
New like in ${n.album}
</span>


<img class="notification-thumb"
src="${getNotificationImage(n.photo)}">

</div>


<div class="notification-date">

${formatNotificationDate(n.time)}

</div>

<button class="notification-delete"
onclick="deleteNotificationComment('${n.id}')">

<img src="icons/trash.png">

</button>

`;
}
if(n.type==="comment"){


div.innerHTML = `


<div class="notification-main">


<img class="notification-icon"
src="icons/comment.png">


<span class="notification-text">
<b>${n.name}</b> left a comment in ${n.album}
</span>


</div>


<img class="notification-thumb notification-album-cover"
src="${getNotificationImage(n.photo)}">


<div class="notification-date">

${formatNotificationDate(n.time)}

</div>


<div class="notification-comment">

<b>Comment:</b> ${n.comment}

</div>


<button class="notification-delete"
onclick="deleteNotificationComment('${n.id}')">

<img src="icons/trash.png">

</button>

`;

}

box.appendChild(div);


if(!n.seen){

markNotification(n.id);

}


});


}




function getNotificationImage(photo){

return r2URL +
photo
.split("/")
.map(encodeURIComponent)
.join("/");

}




async function markNotification(id){


await fetch(
workerURL+
"/mark-notification",
{

method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":
localStorage.getItem("annaEditorPassword")
},

body:JSON.stringify({
id:id
})

});


}



async function deleteNotificationComment(id){


await fetch(
workerURL+
"/delete-comment",
{

method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":
localStorage.getItem("annaEditorPassword")
},

body:JSON.stringify({
id:id
})

});


loadNotifications();


}
loadAlbums();
loadStorage();
getExistingAlbums();
  updateNotificationIcon();
</script>


</body>
<footer class="site-footer">
    © <span id="year"></span> Anna Deng Photography
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
</script>
</html>
