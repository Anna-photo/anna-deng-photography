<!DOCTYPE html>
<html>

<head>

<title>Anna Editor</title>
<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>Anna Deng Photography</h1>

<h2>Editor Mode</h2>

<button onclick="logout()">
Logout
</button>


<div class="editor-bar">

<input 
id="newAlbum"
placeholder="New album name"
>

<button class="editor-button" onclick="createAlbum()">
Create Album
</button>

</div>


<div class="albums" id="albums">

</div>
<div id="snackbar"></div>

<script>
  const password =
localStorage.getItem("annaEditorPassword");

if (!password) {

window.location.href =
"manage.html";

}


const workerURL =
"https://anna-photo-gallery.anna-deng.workers.dev";


async function loadAlbums(){


const response =
await fetch(workerURL + "?albums=true");


const albums =
await response.json();



const container =
document.getElementById("albums");



albums.forEach(album => {


const div =
document.createElement("div");


div.className =
"album";



const image =
album.cover
?
"https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/" +
album.cover.split("/")
.map(encodeURIComponent)
.join("/")
:
"";



div.innerHTML = `

<a class="album-link"
href="edit-album.html?album=${encodeURIComponent(album.name)}">

<img src="${image}">

<h3>${album.name}</h3>

</a>

`;


container.appendChild(div);


});


}



function logout(){

localStorage.removeItem(
"annaEditorPassword"
);

window.location.href =
"manage.html";

}

  function editAlbum(name){

window.location.href =
"edit-album.html?album=" +
encodeURIComponent(name);

}
async function createAlbum(){


const name =
document.getElementById("newAlbum").value.trim();


if(!name){

showSnackbar("Enter album name");
return;

}



const password =
localStorage.getItem("annaEditorPassword");



const response =
await fetch(
workerURL + "/create-album",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({
name:name
})

}
);



const result =
await response.json();



if(result.success){

alert("AlshowSnackbar("Album created");

setTimeout(function(){

location.reload();

},700);bum created");

location.reload();

}
else{

showSnackbar(result.error);
}


}
function showSnackbar(message){

const bar =
document.getElementById("snackbar");

bar.innerHTML = message;

bar.classList.add("show");

setTimeout(function(){

bar.classList.remove("show");

},3000);

}
loadAlbums();


</script>


</body>

</html>
