<!DOCTYPE html>
<html>

<head>

<title>Anna Editor</title>
<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>Anna Deng Photography</h1>

<h2>Editor Mode</h2>

<button onclick="logout()">
Logout
</button>


<div class="editor-bar">

<input 
id="newAlbum"
placeholder="New album name"
>

<button class="editor-button" onclick="createAlbum()">
Create Album
</button>

</div>


<div class="albums" id="albums">

</div>
<div id="snackbar"></div>
  <div id="confirmBox" class="confirm-overlay">

<div class="confirm-dialog">

<h3 id="confirmText"></h3>

<div class="confirm-buttons">

<button class="danger-button" onclick="confirmYes()">
Delete
</button>

<button onclick="confirmNo()">
Cancel
</button>

</div>

</div>

</div>
<div id="albumMenu" class="popup-menu"></div>
<script>
  const password =
localStorage.getItem("annaEditorPassword");

if (!password) {

window.location.href =
"manage.html";

}


const workerURL =
"https://anna-photo-gallery.anna-deng.workers.dev";


async function loadAlbums(){


const response =
await fetch(workerURL + "?albums=true");


const albums =
await response.json();



const container =
document.getElementById("albums");



albums.forEach(album => {


const div =
document.createElement("div");


div.className =
"album";



const image =
album.cover
?
"https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/" +
album.cover.split("/")
.map(encodeURIComponent)
.join("/")
:
"";



div.innerHTML = `

<div class="album-card">

<a class="album-link"
href="edit-album.html?album=${encodeURIComponent(album.name)}">

<img src="${image}">

<h3>${album.name}</h3>

</a>

<button 
class="album-menu-button"
onclick="albumMenu(event, '${album.name}')">

&#8942;

</button>

</div>

`;  container.appendChild(div);


});


}



function logout(){

localStorage.removeItem(
"annaEditorPassword"
);

window.location.href =
"manage.html";

}

  function editAlbum(name){

window.location.href =
"edit-album.html?album=" +
encodeURIComponent(name);

}
async function createAlbum(){


const name =
document.getElementById("newAlbum").value.trim();


if(!name){

showSnackbar("Enter album name");
return;

}



const password =
localStorage.getItem("annaEditorPassword");



const response =
await fetch(
workerURL + "/create-album",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({
name:name
})

}
);



const result =
await response.json();



if(result.success){

showSnackbar("Album created");

setTimeout(function(){

location.reload();

},700);

}
else{

showSnackbar(result.error);

}


}
function showSnackbar(message){

const bar =
document.getElementById("snackbar");

bar.innerHTML = message;

bar.classList.add("show");

setTimeout(function(){

bar.classList.remove("show");

},3000);

}
  let confirmAction = null;


function showConfirm(message, action){

document.getElementById("confirmText").innerHTML =
message;

confirmAction = action;

document.getElementById("confirmBox").style.display =
"flex";

}


function confirmYes(){

document.getElementById("confirmBox").style.display =
"none";

if(confirmAction){

confirmAction();

}

confirmAction = null;

}


function confirmNo(){

document.getElementById("confirmBox").style.display =
"none";

confirmAction = null;

}
  let currentAlbum = null;



function renameAlbum(){

showSnackbar(
"Rename album coming next"
);

}



function deleteAlbum(name){

showConfirm(
"Are you sure you want to delete " + name + "?<br><br>This cannot be undone.",
function(){

performDeleteAlbum(name);

}
);

}
async function performDeleteAlbum(name){


const password =
localStorage.getItem("annaEditorPassword");


const response =
await fetch(
workerURL + "/delete-album",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({

album:name

})

}
);


const result =
await response.json();


if(result.success){

showSnackbar("Album deleted");


setTimeout(()=>{

location.reload();

},1000);


}

else{

showSnackbar(result.error);

}

}
  function albumMenu(e, name){

e.preventDefault();
e.stopPropagation();

const menu =
document.getElementById("albumMenu");

menu.innerHTML = `

<button onclick="deleteAlbum('${name}')">
Delete Album
</button>

<button onclick="renameAlbum('${name}')">
Rename Album
</button>

`;

menu.style.display="block";
menu.style.position="fixed";
menu.style.top =
(e.clientY + 10) + "px";

menu.style.left =
(e.clientX - 180) + "px";

}
  document.addEventListener(
"click",
function(e){

const menu =
document.getElementById("albumMenu");


if(
menu.style.display === "block" &&
!menu.contains(e.target)
){

menu.style.display="none";

}

}
);
loadAlbums();


</script>


</body>

</html>
