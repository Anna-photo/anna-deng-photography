<!DOCTYPE html>
<html>

<head>
    <title>Anna Deng Photography</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Anna Deng Photography</h1>

<p>Photography by Anna Deng</p>

<h2>Albums</h2>


<div class="albums" id="albums">

</div>


<script>

const workerURL =
"https://anna-photo-gallery.anna-deng.workers.dev/";




async function loadAlbums(){

    const response =
    await fetch(workerURL + "?albums=true");


    const albums =
    await response.json();


    const container =
    document.getElementById("albums");


    albums.forEach(album => {


        const div =
        document.createElement("div");


        div.className =
        "album";


     const image =
album.cover
? "https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/" +
album.cover.split("/")
.map(encodeURIComponent)
.join("/")
: "images/default-cover.jpg";

     div.innerHTML = `

<a href="album.html?album=${encodeURIComponent(album.name)}">

    <img src="${image}">

    <h3>${album.name}</h3>

</a>

`;

        container.appendChild(div);


    });


}



loadAlbums();


</script>

</body>

</html>
