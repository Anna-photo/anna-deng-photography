<!DOCTYPE html>
<html>

<head>
    <title>Anna Deng Photography</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<img class="anna-logo" src="icons/anna-logo.png" alt="Anna Deng Photography">

<h2>Albums</h2>


<div class="albums" id="albums">

</div>


<script>

const workerURL =
"https://anna-photo-gallery.anna-deng.workers.dev/";




async function loadAlbums(){

    const response =
    await fetch(workerURL + "?albums=true");


    const albums =
    await response.json();


    const container =
    document.getElementById("albums");


  albums.forEach(async album => {


    if(!album.cover){
        return;
    }


    const div =
    document.createElement("div");


    div.className =
    "album";


    const photoResponse =
    await fetch(
        workerURL +
        "?album=" +
        encodeURIComponent(album.name)
    );


    const photos =
    await photoResponse.json();


    const photoCount =
    photos.filter(photo => !photo.endsWith("/")).length;

     const image =
album.cover
? "https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/" +
album.cover.split("/")
.map(encodeURIComponent)
.join("/")
: "images/default-cover.jpg";

     div.innerHTML = `

<a href="album.html?album=${encodeURIComponent(album.name)}">

    <img src="${image}">

<h3>${album.name}</h3>
<p class="album-count">${photoCount} photos</p></a>

`;

        container.appendChild(div);


    });


}



loadAlbums();


</script>

</body>

</html>
