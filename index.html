<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Anna Deng Photography</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<img class="anna-logo" src="icons/anna-logo.png" alt="Anna Deng Photography">

<h2 id="pageTitle">Albums</h2>

<button onclick="toggleLanguage()" id="languageButton">
中文
</button>

<div class="albums" id="albums">

</div>


<script>

const workerURL =
"https://anna-photo-gallery.anna-deng.workers.dev/";

let language = localStorage.getItem("language") || "en";

function toggleLanguage(){

    language =
    language === "en" ? "zh" : "en";

    localStorage.setItem("language", language);


    document.getElementById("languageButton").innerHTML =
    language === "en" ? "中文" : "English";


    document.getElementById("pageTitle").innerHTML =
    language === "en" ? "Albums" : "相册";


    document.getElementById("albums").innerHTML = "";

    loadAlbums();

}
async function loadAlbums(){

    const response =
    await fetch(workerURL + "?albums=true");


    const text =
await response.text();

const albums =
JSON.parse(text);

const publicAlbums = albums.filter(album => album.public);
    const container =
    document.getElementById("albums");


for (const album of publicAlbums) {
    if(language === "zh" && !album.chinese){
        continue;
    }
    if(!album.cover){
        continue;
    }


    const div =
    document.createElement("div");


    div.className =
    "album";


    const photoResponse =
    await fetch(
        workerURL +
        "?album=" +
        encodeURIComponent(album.name)
    );


    const photos =
    await photoResponse.json();


    const photoCount =
    photos.filter(photo => !photo.endsWith("/")).length;


    const image =
    "https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/" +
    album.cover.split("/")
    .map(encodeURIComponent)
    .join("/");


    div.innerHTML = `

<a href="album.html?album=${encodeURIComponent(album.name)}&lang=${language}">
    <img src="${image}">

<h3>
${language === "zh" ? album.chinese : album.name}
</h3>
<p class="album-count">
${photoCount} ${language === "zh" ? "张照片" : "photos"}
</p>
</a>

`;


    container.appendChild(div);


}
}

function applyLanguage(){

    document.getElementById("languageButton").innerHTML =
    language === "en"
    ? "中文"
    : "English";


    document.getElementById("pageTitle").innerHTML =
    language === "en"
    ? "Albums"
    : "相册";

}

applyLanguage();
loadAlbums();

</script>
<footer class="site-footer">
    © <span id="year"></span> Anna Deng Photography
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>

</html>
