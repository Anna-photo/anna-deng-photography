<!DOCTYPE html>
<html>

<head>
    <title>Anna Deng Photography</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Anna Deng Photography</h1>

<p>Photography by Anna Deng</p>

<h2>Albums</h2>


<div class="albums" id="albums">

</div>


<script>

const workerURL =
"https://anna-photo-gallery.anna-deng.workers.dev/";


const coverImages = {

    "2026 Madagascar":
    "images/madagascar-cover.jpg",

    "2026 Japan":
    "images/japan-cover.jpg",

    "2025 Socotra":
    "images/socotra-cover.jpg"

};



async function loadAlbums(){

    const response =
    await fetch(workerURL + "?albums=true");


    const albums =
    await response.json();


    const container =
    document.getElementById("albums");


    albums.forEach(album => {


        const div =
        document.createElement("div");


        div.className =
        "album";


        const image =
        coverImages[album] ||
        "images/default-cover.jpg";


        div.innerHTML = `

        <a href="album.html?album=${encodeURIComponent(album)}">

            <img src="${image}">

            <h3>${album}</h3>

        </a>

        `;


        container.appendChild(div);


    });


}



loadAlbums();


</script>

</body>

</html>
