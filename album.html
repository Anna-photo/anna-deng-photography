<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Album</title>

<link rel="stylesheet" href="style.css">

</head>

<body>


<h1 id="album-title">Loading...</h1>

<div class="gallery" id="gallery"></div>
    <br><br>
<a href="index.html">← Back to Albums</a>


<script>

const workerURL = "https://anna-photo-gallery.anna-deng.workers.dev/";

const params = new URLSearchParams(window.location.search);
const album = params.get("album");


document.getElementById("album-title").textContent = album;


async function loadPhotos() {

    const response = await fetch(
        workerURL + "?album=" + encodeURIComponent(album)
    );

    const photos = await response.json();

    const gallery = document.getElementById("gallery");


    photos.forEach(photo => {

        if (photo.endsWith("/")) return;


        const img = document.createElement("img");

       img.src =
"https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/"
+ photo.split("/").map(encodeURIComponent).join("/");


        img.alt = album;

        gallery.appendChild(img);

    });

}


loadPhotos();

</script>


</body>
</html>
