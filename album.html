<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Album</title>

<link rel="stylesheet" href="style.css">

<style>

body {
    margin: 0;
    padding: 20px;
}


/* Main container */

.album-container {
    max-width: 1500px;
    margin: auto;
}


/* Title */

.album-title {
    text-align: center;
    margin: 25px 0 45px;
    font-size: 2.3rem;
}


/* Loading */

#loading {

    text-align: center;

    margin: 60px auto;

    font-size: 1.2rem;

    opacity: .7;

}


#loading::after {

    content: "";

    display: block;

    width: 35px;

    height: 35px;

    margin: 20px auto;

    border: 4px solid #ccc;

    border-top-color: #333;

    border-radius: 50%;

    animation: spin 1s linear infinite;

}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}



/* Masonry-style gallery */

.gallery {

    columns: 4 280px;

    column-gap: 20px;

    padding: 20px;

}


.gallery img {

    width:100%;

    height:auto;

    margin-bottom:20px;

    border-radius:12px;

    cursor:pointer;

    display:block;

    break-inside:avoid;

    opacity:0;

    transform:translateY(15px);

    transition:
        opacity .5s ease,
        transform .5s ease,
        scale .25s ease;

}
.gallery img.loaded {

    opacity: 1;

    transform: translateY(0);

}



.gallery img:hover {

    scale: 1.02;

}







/* Lightbox */

.lightbox {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.94);

    z-index: 999;

    align-items: center;

    justify-content: center;

}



.lightbox img {

    max-width:90vw;

    max-height:75vh;

    object-fit:contain;

}
.lightbox button {

    position: absolute;

    border: none;

    background: transparent;

    color: white;

    cursor: pointer;

    font-size: 55px;

}



.close-button {

    top: 20px;

    right: 30px;

}



.previous-button {

    left: 25px;

}



.next-button {

    right: 25px;

}



/* Mobile */

@media(max-width:700px){

    body {
        padding: 10px;
    }


    .album-title {

        font-size: 1.8rem;

    }


    .gallery {

        columns: 1;

    }


    .lightbox button {

        font-size: 40px;

    }

}
    /* Prevent easy image saving */
.gallery img,
.lightbox img {

    user-select: none;

    -webkit-user-drag: none;

    -webkit-touch-callout: none;

}
    #lightbox {
    position: fixed !important;
    inset: 0 !important;
    display: none;
    align-items: center !important;
    justify-content: center !important;
}
/* Comments */

#commentsSection{

max-width:900px;
margin:60px auto;
color:white;

}


#commentsSection h2{

text-align:center;

}


.comment-card{

background:#222;
padding:15px;
border-radius:12px;
margin-bottom:15px;

}


.comment-name{

font-weight:bold;
font-size:18px;

}


.comment-time{

font-size:13px;
color:#aaa;
margin-top:8px;

}


.comment-box{

display:flex;
flex-direction:column;
gap:10px;

}


.comment-box input,
.comment-box textarea{

font-family:Arial,sans-serif;
font-size:16px;

padding:12px;

border-radius:10px;

border:none;

}


.comment-box textarea{

height:100px;
resize:none;

}


.comment-box button{

width:150px;
align-self:center;

}
.photo-wrapper {

position:relative;

display:flex;

flex-direction:column;

align-items:flex-end;

}


.photo-wrapper #largeImage {

max-width:90vw;

max-height:65vh !important;

object-fit:contain;

display:block;

}


.like-area {

display:flex;

align-items:center;

gap:8px;

margin-top:10px;

margin-right:5%;

}


#likeButton {

background:none;

border:none;

padding:0;

cursor:pointer;

}


#likeButton img {

width:38px;

height:38px;

display:block;

}


#likeCount {

color:white;

font-size:18px;

}
    #lightbox,
#lightbox img,
#largeImage {
    background:transparent !important;
}
</style>
</head>


<body>
<img class="anna-logo viewer-logo" src="icons/anna-logo.png" alt="Anna Deng Photography">

<button id="languageButton" onclick="toggleLanguage()">
</button>
<a class="editor-back viewer-back" href="index.html">
<img src="icons/back.png">

<span id="backText">Albums</span>

</a>
<h1 class="album-title" id="albumTitle">
</h1>


<div id="loading"></div>

<div id="emptyMessage" class="empty-message" style="display:none;">
This album is empty. Add photos to get started.
</div>
<div class="gallery" id="gallery">

</div>
<div id="commentsSection">

<h2>Comments</h2>

<div id="commentList"></div>


<div class="comment-box">

<input id="commentName" placeholder="Your name">

<textarea id="commentText" placeholder="Write a comment"></textarea>

<button onclick="submitComment()">
Post Comment
</button>

</div>

</div>


</div>


<div class="lightbox" id="lightbox">


<button class="close-button" onclick="closeLightbox()">
×
</button>


<button class="previous-button" onclick="changePhoto(-1)">
‹
</button>


<div class="photo-wrapper">

<img id="largeImage" draggable="false">

<div class="like-area">

<button id="likeButton" onclick="likeCurrentPhoto()">
<img id="likeIcon" src="icons/white-heart.png">
</button>

<span id="likeCount">0</span>

</div>

<div id="lightboxCaption"></div>

</div>
<button class="next-button" onclick="changePhoto(1)">
›
</button>

</div>
<script>

const workerURL =
"https://anna-photo-gallery.anna-deng.workers.dev";
const r2URL =
"https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/";
    let viewerID = localStorage.getItem("viewerID");

if(!viewerID){

viewerID =
crypto.randomUUID();

localStorage.setItem(
"viewerID",
viewerID
);

}

const params =
new URLSearchParams(window.location.search);

const album =
params.get("album");
const language =
localStorage.getItem("language") || "en";    function toggleLanguage(){

    const current =
    localStorage.getItem("language") || "en";

    localStorage.setItem(
        "language",
        current === "en" ? "zh" : "en"
    );

    location.reload();

}
    document.getElementById("albumTitle").textContent =
language === "zh"
    ? "加载中..."
: "Loading...";
document.getElementById("loading").textContent =
language === "zh"
? "正在加载照片..."
: "Loading photographs...";
    function applyViewerLanguage(){

    document.getElementById("backText").textContent =
    language === "zh"
    ? "相册"
    : "Albums";

}
    function applyLanguageButton(){

    const button =
    document.getElementById("languageButton");

    if(!button) return;


    button.textContent =
    language === "en"
    ? "中文"
    : "English";

}
async function loadAlbumTitle(){


    const response =
    await fetch(workerURL + "?albums=true");


    const albums =
    await response.json();


    const current =
    albums.find(item => item.name === album);


    document.getElementById("albumTitle").textContent =
    language === "zh" && current && current.chinese
    ? current.chinese
    : album || "Album";

}


applyViewerLanguage();
loadAlbumTitle();
applyLanguageButton();
let photos = [];let currentPhoto = 0;



async function loadPhotos(){

    try {

        const response = await fetch(
            workerURL +
            "?album=" +
            encodeURIComponent(album)
        );


        photos = await response.json();


        const gallery =
        document.getElementById("gallery");
        if(photos.length === 0){

document.getElementById("loading").style.display="none";

document.getElementById("emptyMessage").style.display="block";

return;

}


        document.getElementById("loading")
        .style.display = "none";


        photos.forEach((photo,index)=>{


            if(photo.endsWith("/")){
                return;
            }


            const img =
            document.createElement("img");


            img.loading = "lazy";


            img.src =
            getImageURL(photo);


            img.onload = function(){

                img.classList.add("loaded");

            };


            img.alt = album;
img.draggable = false;

            img.onclick = function(){

                currentPhoto = index;

                openLightbox();

            };


            gallery.appendChild(img);


        });


    }

    catch(error){

      document.getElementById("loading")
.textContent =
language === "zh"
? "无法加载照片。"
: "Unable to load photographs.";
        console.error(error);

    }

}



function getImageURL(photo){

    return r2URL +
    photo
    .split("/")
    .map(encodeURIComponent)
    .join("/");

}



function preload(index){

    if(!photos[index]) return;


    const img =
    new Image();


    img.src =
    getImageURL(
        photos[index]
    );

}



function openLightbox(){

    document.getElementById("lightbox")
    .style.display = "flex";


    showPhoto();


    preload(currentPhoto + 1);

    preload(currentPhoto - 1);

}



async function showPhoto(){


    const big =
    document.getElementById("largeImage");


    big.style.opacity = 0;


    setTimeout(async ()=>{


        big.src =
        getImageURL(
            photos[currentPhoto]
        );


        big.onload = ()=>{

            big.style.opacity = 1;

        };


        loadCaption(
            photos[currentPhoto]
        );

loadLikes(
    photos[currentPhoto]
);
    },150);

}
    function closeLightbox(){

    document.getElementById("lightbox")
    .style.display = "none";

}



function changePhoto(direction){


    let next =
    currentPhoto + direction;



    while(true){


        if(next < 0){

            next =
            photos.length - 1;

        }


        if(next >= photos.length){

            next = 0;

        }


        if(!photos[next].endsWith("/")){

            break;

        }


        next += direction;

    }



    currentPhoto = next;


    showPhoto();


    preload(currentPhoto + direction);


}



document.addEventListener(
"keydown",
function(e){


    if(e.key === "Escape")
        closeLightbox();


    if(e.key === "ArrowLeft")
        changePhoto(-1);


    if(e.key === "ArrowRight")
        changePhoto(1);


});





// Close clicking outside image

document
.getElementById("lightbox")
.addEventListener(
"click",
function(e){

    if(e.target.id === "lightbox"){

        closeLightbox();

    }

});





// Touch swipe support

let touchStartX = 0;


document
.getElementById("lightbox")
.addEventListener(
"touchstart",
function(e){

    touchStartX =
    e.changedTouches[0].screenX;

});



document
.getElementById("lightbox")
.addEventListener(
"touchend",
function(e){


    let touchEndX =
    e.changedTouches[0].screenX;


    if(touchEndX < touchStartX - 50){

        changePhoto(1);

    }


    if(touchEndX > touchStartX + 50){

        changePhoto(-1);

    }


});

async function loadCaption(photo){

    const captionBox =
    document.getElementById("lightboxCaption");


    try {


        const response =
        await fetch(
            workerURL +
            "/get-caption?key=" +
            encodeURIComponent(photo)
        );


        const data =
        await response.json();



        let text = "";


        if(language === "zh"){

            text =
            data.chinese || "";

        }
        else{

            text =
            data.english || "";

        }



        if(text){

            captionBox.textContent = text;

            captionBox.style.display =
            "block";

        }
        else{

            captionBox.textContent = "";

            captionBox.style.display =
            "none";

        }


    }

    catch(e){

        captionBox.style.display =
        "none";

    }


}
async function loadLikes(photo){

const response =
await fetch(
workerURL +
"/get-likes?key=" +
encodeURIComponent(photo) +
"&viewer=" +
encodeURIComponent(viewerID)
);


const data =
await response.json();


document.getElementById("likeCount")
.textContent =
data.count || 0;


document.getElementById("likeIcon").src =
data.liked
?
"icons/red-heart.png"
:
"icons/white-heart.png";


}
async function likeCurrentPhoto(){

const photo =
photos[currentPhoto];


const response =
await fetch(
workerURL + "/like-photo",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

key:photo,

viewer:viewerID

})

}

);


const data =
await response.json();


document.getElementById("likeCount")
.textContent =
data.count;


document.getElementById("likeIcon").src =
data.liked
?
"icons/red-heart.png"
:
"icons/white-heart.png";


}
    // Disable right click on images
document.addEventListener(
"contextmenu",
function(e){

    if(e.target.tagName === "IMG"){

        e.preventDefault();

    }

});


// Disable dragging images
document.addEventListener(
"dragstart",
function(e){

    if(e.target.tagName === "IMG"){

        e.preventDefault();

    }

});


// Disable common copy shortcuts on photos
document.addEventListener(
"keydown",
function(e){

    if(
        (e.ctrlKey || e.metaKey)
        &&
        ["s","c","u"].includes(e.key.toLowerCase())
    ){

        e.preventDefault();

    }

});
async function submitComment(){

const name =
document.getElementById("commentName")
.value
.trim();


const comment =
document.getElementById("commentText")
.value
.trim();



if(!name || !comment){

alert("Please enter your name and comment");

return;

}



await fetch(
workerURL + "/add-comment",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

album:album,

name:name,

comment:comment

})

});


document.getElementById("commentText")
.value="";


loadComments();

}



async function loadComments(){


const response =
await fetch(
workerURL +
"/get-comments?album=" +
encodeURIComponent(album)
);



const comments =
await response.json();



const box =
document.getElementById("commentList");



box.innerHTML="";



comments.forEach(c=>{


const div =
document.createElement("div");


div.className="comment-card";


div.innerHTML=`

<div class="comment-name">
${c.name}
</div>

<div>
${c.comment}
</div>

<div class="comment-time">
${new Date(c.time).toLocaleString()}
</div>

`;


box.appendChild(div);


});


}
loadPhotos();
loadComments();


</script>
<footer class="site-footer">
    © 2026 Anna Deng Photography
</footer>
</body>
</html>
