<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Album</title>

<link rel="stylesheet" href="style.css">

<style>

body {
    margin: 0;
    padding: 20px;
}


/* Main container */

.album-container {
    max-width: 1500px;
    margin: auto;
}


/* Title */

.album-title {
    text-align: center;
    margin: 25px 0 45px;
    font-size: 2.3rem;
}


/* Loading */

#loading {

    text-align: center;

    margin: 60px auto;

    font-size: 1.2rem;

    opacity: .7;

}


#loading::after {

    content: "";

    display: block;

    width: 35px;

    height: 35px;

    margin: 20px auto;

    border: 4px solid #ccc;

    border-top-color: #333;

    border-radius: 50%;

    animation: spin 1s linear infinite;

}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}



/* Masonry-style gallery */

.gallery {

    display: grid;

    grid-template-columns:
    repeat(auto-fit, minmax(280px, 1fr));

    gap: 20px;

    align-items: start;

}



.gallery img {

    width: 100%;

    height: auto;

    margin-bottom: 20px;

    border-radius: 12px;

    cursor: pointer;

    display: block;

    object-fit: contain;

    opacity: 0;

    transform: translateY(15px);

    transition:
        opacity .5s ease,
        transform .5s ease,
        scale .25s ease;

}


.gallery img.loaded {

    opacity: 1;

    transform: translateY(0);

}



.gallery img:hover {

    scale: 1.02;

}







/* Lightbox */

.lightbox {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.94);

    z-index: 999;

    align-items: center;

    justify-content: center;

}



.lightbox img {

    max-width: 92%;

    max-height: 92%;

    object-fit: contain;

    opacity: 1;

    transition: opacity .25s ease;

}



.lightbox button {

    position: absolute;

    border: none;

    background: transparent;

    color: white;

    cursor: pointer;

    font-size: 55px;

}



.close-button {

    top: 20px;

    right: 30px;

}



.previous-button {

    left: 25px;

}



.next-button {

    right: 25px;

}



/* Mobile */

@media(max-width:700px){

    body {
        padding: 10px;
    }


    .album-title {

        font-size: 1.8rem;

    }


    .gallery {

        columns: 1;

    }


    .lightbox button {

        font-size: 40px;

    }

}

</style>
</head>


<body>


<div class="album-container">
<a class="editor-back viewer-back" href="index.html">
<img src="icons/back.png">

<span>Albums</span>

</a>

<h1 class="album-title" id="albumTitle">
Loading...
</h1>


<div id="loading">
Loading photographs...
</div>


<div id="emptyMessage" class="empty-message" style="display:none;">
This album is empty. Add photos to get started.
</div>
<div class="gallery" id="gallery">

</div>



</div>


<div class="lightbox" id="lightbox">


<button class="close-button" onclick="closeLightbox()">
×
</button>


<button class="previous-button" onclick="changePhoto(-1)">
‹
</button>


<img id="largeImage">


<button class="next-button" onclick="changePhoto(1)">
›
</button>


</div>
<script>

const workerURL =
"https://anna-photo-gallery.anna-deng.workers.dev/";

const r2URL =
"https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/";

const params =
new URLSearchParams(window.location.search);

const album =
params.get("album");
const lang =
params.get("lang") || "en";

async function loadAlbumTitle(){

    const language =
    lang;

    const response =
    await fetch(workerURL + "?albums=true");


    const albums =
    await response.json();


    const current =
    albums.find(item => item.name === album);


    document.getElementById("albumTitle").textContent =
    language === "zh" && current && current.chinese
    ? current.chinese
    : album || "Album";

}


loadAlbumTitle();

let photos = [];

let currentPhoto = 0;



async function loadPhotos(){

    try {

        const response = await fetch(
            workerURL +
            "?album=" +
            encodeURIComponent(album)
        );


        photos = await response.json();


        const gallery =
        document.getElementById("gallery");
        if(photos.length === 0){

document.getElementById("loading").style.display="none";

document.getElementById("emptyMessage").style.display="block";

return;

}


        document.getElementById("loading")
        .style.display = "none";


        photos.forEach((photo,index)=>{


            if(photo.endsWith("/")){
                return;
            }


            const img =
            document.createElement("img");


            img.loading = "lazy";


            img.src =
            getImageURL(photo);


            img.onload = function(){

                img.classList.add("loaded");

            };


            img.alt = album;


            img.onclick = function(){

                currentPhoto = index;

                openLightbox();

            };


            gallery.appendChild(img);


        });


    }

    catch(error){

        document.getElementById("loading")
        .textContent =
        "Unable to load photographs.";

        console.error(error);

    }

}



function getImageURL(photo){

    return r2URL +
    photo
    .split("/")
    .map(encodeURIComponent)
    .join("/");

}



function preload(index){

    if(!photos[index]) return;


    const img =
    new Image();


    img.src =
    getImageURL(
        photos[index]
    );

}



function openLightbox(){

    document.getElementById("lightbox")
    .style.display = "flex";


    showPhoto();


    preload(currentPhoto + 1);

    preload(currentPhoto - 1);

}



function showPhoto(){


    const big =
    document.getElementById("largeImage");


    big.style.opacity = 0;


    setTimeout(()=>{


        big.src =
        getImageURL(
            photos[currentPhoto]
        );


        big.onload = ()=>{

            big.style.opacity = 1;

        };


    },150);

}



function closeLightbox(){

    document.getElementById("lightbox")
    .style.display = "none";

}



function changePhoto(direction){


    let next =
    currentPhoto + direction;



    while(true){


        if(next < 0){

            next =
            photos.length - 1;

        }


        if(next >= photos.length){

            next = 0;

        }


        if(!photos[next].endsWith("/")){

            break;

        }


        next += direction;

    }



    currentPhoto = next;


    showPhoto();


    preload(currentPhoto + direction);


}



document.addEventListener(
"keydown",
function(e){


    if(e.key === "Escape")
        closeLightbox();


    if(e.key === "ArrowLeft")
        changePhoto(-1);


    if(e.key === "ArrowRight")
        changePhoto(1);


});





// Close clicking outside image

document
.getElementById("lightbox")
.addEventListener(
"click",
function(e){

    if(e.target.id === "lightbox"){

        closeLightbox();

    }

});





// Touch swipe support

let touchStartX = 0;


document
.getElementById("lightbox")
.addEventListener(
"touchstart",
function(e){

    touchStartX =
    e.changedTouches[0].screenX;

});



document
.getElementById("lightbox")
.addEventListener(
"touchend",
function(e){


    let touchEndX =
    e.changedTouches[0].screenX;


    if(touchEndX < touchStartX - 50){

        changePhoto(1);

    }


    if(touchEndX > touchStartX + 50){

        changePhoto(-1);

    }


});





loadPhotos();


</script>


</body>
</html>
