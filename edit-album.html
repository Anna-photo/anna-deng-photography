<!DOCTYPE html>
<html>

<head>

<title>Edit Album</title>
<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>Anna Deng Photography</h1>

<h2>Edit Album</h2>

<a href="editor.html" class="editor-button icon-button">

<img src="icons/back.png">

<span>Albums</span>

</a>

<h2 id="title"></h2>

<div class="editor-bar">

<label class="editor-button icon-button">

<img src="icons/add-photo.png">

<input
type="file"
id="files"
multiple
onchange="uploadPhotos()"
hidden
>

</label>
</div>


<div id="photos" class="albums"></div>


<script>
const password =
localStorage.getItem("annaEditorPassword");

if (!password) {

window.location.href =
"manage.html";

}

const workerURL =
"https://anna-photo-gallery.anna-deng.workers.dev";


const params =
new URLSearchParams(location.search);


const album =
params.get("album");


document.getElementById("title").innerHTML =
album;



async function loadPhotos(){


const response =
await fetch(
workerURL +
"?album=" +
encodeURIComponent(album)
);


const photos =
await response.json();


const container =
document.getElementById("photos");


photos.forEach(photo => {


const div =
document.createElement("div");


div.className =
"editor-photo";

const image =
"https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/" +
photo.split("/")
.map(encodeURIComponent)
.join("/");



div.innerHTML = `

<img src="${image}">

<h3>${photo.split("/").pop()}</h3>

<div class="photo-actions">

<button onclick="setCover('${photo}')">
Use as Cover
</button>

<button
class="icon-control"
onclick="deletePhoto('${photo}')">

<img src="icons/trash.png">

</button>`;



container.appendChild(div);


});


}

async function deletePhoto(key){


if(!confirm("Delete this photo?")){

return;

}


const password =
localStorage.getItem("annaEditorPassword");


await fetch(
workerURL + "/delete",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({
key:key
})

}
);


location.reload();


}
  async function setCover(key){


const password =
localStorage.getItem("annaEditorPassword");


await fetch(
workerURL + "/set-cover",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({
key:key
})

}
);


alert("Cover updated");


}
  async function uploadPhotos(){


const password =
localStorage.getItem("annaEditorPassword");


const files =
document.getElementById("files").files;


for (const file of files){


const form =
new FormData();


form.append(
"album",
album
);


form.append(
"file",
file
);



await fetch(
workerURL + "/upload",
{
method:"POST",

headers:{
"X-Upload-Password":password
},

body:form

}
);


}


alert(
"Photos uploaded!"
);


location.reload();


}

loadPhotos();


</script>


</body>

</html>
