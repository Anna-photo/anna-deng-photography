<!DOCTYPE html>
<html>

<head>

<title>Edit Album</title>
<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>Anna Deng Photography</h1>

<h2>Edit Album</h2>

<h3 id="title"></h3>


<div id="photos" class="albums"></div>



<script>
const password =
localStorage.getItem("annaEditorPassword");

if (!password) {

window.location.href =
"manage.html";

}

const workerURL =
"https://anna-photo-gallery.anna-deng.workers.dev";


const params =
new URLSearchParams(location.search);


const album =
params.get("album");


document.getElementById("title").innerHTML =
album;



async function loadPhotos(){


const response =
await fetch(
workerURL +
"?album=" +
encodeURIComponent(album)
);


const photos =
await response.json();


const container =
document.getElementById("photos");


photos.forEach(photo => {


const div =
document.createElement("div");


div.className =
"album";


const image =
"https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/" +
photo.split("/")
.map(encodeURIComponent)
.join("/");



div.innerHTML = `

<img src="${image}">

<h3>${photo.split("/").pop()}</h3>

<button onclick="deletePhoto('${photo}')">
Delete
</button>
`;



container.appendChild(div);


});


}

async function deletePhoto(key){


if(!confirm("Delete this photo?")){

return;

}


const password =
localStorage.getItem("annaEditorPassword");


await fetch(
workerURL + "/delete",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({
key:key
})

}
);


location.reload();


}

loadPhotos();


</script>


</body>

</html>
