<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Edit Album</title>
<link rel="stylesheet" href="style.css">

</head>


<body>


<img class="anna-logo" src="icons/anna-logo.png" alt="Anna Deng Photography">

<button id="languageButton" onclick="toggleLanguage()">
中文
</button>

<div class="editor-topbar">
<a href="editor.html" class="editor-back">

<img src="icons/back.png">

<span id="albumsText">
Albums
</span>
</a>


<div class="editor-actions">

<label class="icon-button">

<img src="icons/add-photo.png">

<input
type="file"
id="files"
multiple
hidden
onchange="uploadPhotos()">

</label>


<button
class="icon-button public-button"
onclick="publicAlbumMenu(event)">

<img src="icons/share.png">

</button>


<button
class="menu-button"
onclick="toggleAlbumMenu(event)">

&#8942;

</button>


</div>
</div>


<h2 id="title"></h2>


<div
id="albumMenu"
class="popup-menu">

<button
onclick="startCoverSelection()"
id="changeCoverText">

Change Album Cover

</button>
<button
onclick="renameAlbum()"
id="renameAlbumText">

Rename Album

</button>
<<button
onclick="deleteAlbum()"
id="deleteAlbumText">

Delete Album

</button>
</div>


<div id="photos" class="albums"></div>
  <div id="lightbox" class="lightbox">

<button
class="lightbox-close"
onclick="closeLightbox()">

&times;


</button>


<button
class="lightbox-prev"
onclick="previousPhoto()">

&#8249;

</button>


<button
class="lightbox-next"
onclick="nextPhoto()">

&#8250;

</button>

<div class="lightbox-content">

<img
id="lightbox-image">

<div id="captionEditor">
<div class="caption-row">

<textarea
id="captionEnglish"
maxlength="200"
placeholder="English caption"
id="englishCaptionInput"
  </textarea>


<textarea
id="captionChinese"
maxlength="100"
placeholder="中文说明">
</textarea>


<button onclick="saveCaption()" id="saveCaptionText">
Save
</button>
</div>


<div class="caption-counts">

<span id="englishCount">0 / 200</span>

<span id="chineseCount">0 / 100</span>

</div>

</div>

</div>

<div class="lightbox-actions">

<button
class="icon-control"
onclick="deleteLightboxPhoto()">

<img src="icons/trash.png">

</button>


<button
class="menu-button"
onclick="photoMenu(event, currentPhoto)">

&#8942;

</button>


</div>

</div>

<div
id="photoMenu"
class="popup-menu">

<button
onclick="setLightboxAsCover()"
id="setCoverText">

Set This Image as Album Cover

</button>
<button
onclick="addToOtherAlbum()"
id="addOtherAlbumText">

Add to Other Album

</button>
<button
onclick="downloadPhoto()"
id="downloadPhotoText">

Download Photo

</button>
</div>
  <div id="albumPicker" class="album-picker-overlay">

<div class="album-picker-box">

<h2 id="addAlbumTitleText">
Add to Other Album
</h2>
<div id="albumList"></div>

<button onclick="closeAlbumPicker()" id="cancelPickerText">
Cancel
</button>
</div>

</div>
  <div id="snackbar"></div>
  <div id="uploadStatus" class="upload-status">

<h3 id="uploadTitle">
Uploading images
</h3>
<p id="uploadProgress">
0 of 0
</p>

<button onclick="cancelUpload()" id="cancelUploadText">
Cancel Upload
</button>

</div>
  <div id="confirmBox" class="confirm-overlay">

<div class="confirm-dialog">

<h3 id="confirmText"></h3>

<div class="confirm-buttons">

<button onclick="confirmYes()">
Delete
</button>

<button onclick="confirmNo()">
Cancel
</button>

</div>

</div>

</div>


<div id="publicBox" class="confirm-overlay">

<div class="confirm-dialog">

<h3 id="publicText"></h3>

<div class="confirm-buttons">

<button
class="public-yes"
onclick="confirmPublicYes()">
Yes
</button>

<button onclick="closePublicBox()">
No
</button>

</div>

</div>

</div>
  <div id="renameBox" class="confirm-overlay">

<div class="confirm-dialog">

<h3>Rename Album</h3>

<input 
id="renameInput" 
type="text"
placeholder="English album name"
>


<input 
id="renameChineseInput"
type="text"
placeholder="中文名称"
>


<div class="confirm-buttons">
<button onclick="confirmRename()">
Rename
</button>

<button onclick="cancelRename()">
Cancel
</button>

</div>

</div>

</div>
<div id="dropOverlay">

<div class="drop-message">

<div class="arrow">↑</div>

<p>Drop photo anywhere to upload.</p>

</div>

</div>

<script>
const password =
localStorage.getItem("annaEditorPassword");

if (!password) {

window.location.href =
"manage.html";

}

const workerURL =
"https://anna-photo-gallery.anna-deng.workers.dev";
const language =
localStorage.getItem("language") || "en";


function toggleLanguage(){

localStorage.setItem(
"language",
language === "en" ? "zh" : "en"
);

location.reload();

}

const params =
new URLSearchParams(location.search);


const album =
params.get("album");


document.getElementById("title").innerHTML =
album;

 let currentPhoto = null;
let lightboxPhotos = [];
let selectingCover = false;
let albumIsPublic = false;
let currentIndex = 0;

const ENGLISH_CAPTION_LIMIT = 200;
const CHINESE_CAPTION_LIMIT = 100;

let currentCaption = {
english:"",
chinese:""
};async function loadAlbumInfo(){

const response =
await fetch(workerURL + "?albums=true");


const albums =
await response.json();


const current =
albums.find(item => item.name === album);


if(current){

albumIsPublic = current.public;

}

}
async function loadPhotos(){


const response =
await fetch(
workerURL +
"?album=" +
encodeURIComponent(album)
);


const photos =
await response.json();
  lightboxPhotos = photos;


const container =
document.getElementById("photos");
if(photos.length === 0){

const container =
document.getElementById("photos");

container.innerHTML = `

<div class="empty-album-message">

`
<div class="empty-album-message">

<h2>
${t(
"This album is empty.",
"此相册为空。"
)}
</h2>

<p>
${t(
"Add photos to get started.",
"添加照片开始使用。"
)}
</p>

</div>
`
</div>

`;

return;

}

photos.forEach(photo => {


const div =
document.createElement("div");


div.className =
"editor-photo";

const image =
"https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/" +
photo.split("/")
.map(encodeURIComponent)
.join("/");



div.innerHTML = `

<div class="photo-wrapper">

<img
src="${image}"
onclick="photoClicked('${photo}')">

`;

container.appendChild(div);


});


}

async function performDeletePhoto(key){

const password =
localStorage.getItem("annaEditorPassword");


await fetch(
workerURL + "/delete",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({
key:key
})

}
);


showSnackbar(
t(
"Photo deleted",
"照片已删除"
)
);

setTimeout(()=>{

location.reload();

},800);

}
  async function setCover(key){


const password =
localStorage.getItem("annaEditorPassword");


await fetch(
workerURL + "/set-cover",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({
key:key
})

}
);

showSnackbar(
t(
"Cover updated",
"封面已更新"
)
);

}
  function setLightboxAsCover(){

if(!currentPhoto){

showSnackbar(
t(
"No photo selected",
"未选择照片"
)
);
return;

}


setCover(currentPhoto);


document.getElementById("photoMenu").style.display="none";


showSnackbar(
t(
"Album cover changed",
"相册封面已更改"
)
);
}
async function uploadPhotos(){

    const files =
    document.getElementById("files").files;

    if(!files.length){
        return;
    }

    uploadFiles(files);

}
  let uploadCancelled = false;


async function uploadFiles(files){


uploadCancelled = false;


const total =
files.length;


const status =
document.getElementById("uploadStatus");


const title =
document.getElementById("uploadTitle");


const progress =
document.getElementById("uploadProgress");


status.style.display="block";


title.innerHTML =
total === 1
?
t(
"Uploading image",
"正在上传照片"
)
:
t(
"Uploading images",
"正在上传照片"
);

progress.innerHTML =
"0 of " + total;



const password =
localStorage.getItem("annaEditorPassword");


let completed = 0;


for(const file of files){


if(uploadCancelled){

break;

}



const form =
new FormData();


form.append(
"album",
album
);


form.append(
"file",
file
);



await fetch(
workerURL + "/upload",
{
method:"POST",

headers:{
"X-Upload-Password":password
},

body:form

}
);



completed++;


progress.innerHTML =
completed +
" of " +
total;


}



if(uploadCancelled){

showSnackbar(
t(
"Upload cancelled",
"上传已取消"
)
);
}
else{

showSnackbar(
t(
"Upload complete",
"上传完成"
)
);
setTimeout(()=>{

location.reload();

},800);

}


status.style.display="none";


}
  function cancelUpload(){

uploadCancelled = true;

}
function toggleAlbumMenu(e){

e.stopPropagation();

const menu =
document.getElementById("albumMenu");

menu.style.display="block";

menu.style.position="fixed";

menu.style.top =
(e.clientY + 10) + "px";

menu.style.left =
(e.clientX - 200) + "px";

}
function startCoverSelection(){

document.getElementById("albumMenu").style.display="none";

showSnackbar("Click a photo to set it as the album cover");

selectingCover = true;

document.body.classList.add("cover-mode");
}




async function renameAlbum(){

document.getElementById("albumMenu").style.display="none";

document.getElementById("renameInput").value = album;


const response =
await fetch(workerURL + "?albums=true");


const albums =
await response.json();


const current =
albums.find(a => a.name === album);


document.getElementById("renameChineseInput").value =
current && current.chinese
? current.chinese
: "";


document.getElementById("renameBox").style.display="flex";

}

function confirmRename(){

const newName =
document.getElementById("renameInput").value.trim();

const chinese =
document.getElementById("renameChineseInput").value.trim();


if(!newName){

showSnackbar(
t(
"Enter English album name",
"请输入英文相册名称"
)
);
  return;

}


if(!chinese){

showSnackbar(
t(
"Enter Chinese album name",
"请输入中文相册名称"
)
);
  return;

}


const password =
localStorage.getItem("annaEditorPassword");


fetch(
workerURL + "/rename-album",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({

oldName:album,

newName:newName,

chinese:chinese

})

}
)
.then(()=>{

document.getElementById("renameBox").style.display="none";

showSnackbar(
t(
"Album renamed",
"相册已重命名"
)
);

setTimeout(()=>{

location.href =
"edit-album.html?album=" +
encodeURIComponent(newName);

},1000);


});


}

function cancelRename(){

document.getElementById("renameBox").style.display="none";

}
  function deleteAlbum(){

showConfirm(
t(
"Delete this album and all photos?",
"确定删除此相册以及所有照片吗？"
),
  async function(){

const password =
localStorage.getItem("annaEditorPassword");


await fetch(
workerURL + "/delete-album",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({

album:album

})

}
);


showSnackbar(
t(
"Album deleted",
"相册已删除"
)
);

setTimeout(()=>{

location.href="editor.html";

},1000);


});

}
  function photoMenu(e,key){

e.stopPropagation();


currentPhoto = key;


const menu =
document.getElementById("photoMenu");


menu.style.display="block";


menu.style.position="fixed";


menu.style.top =
(e.clientY + 10) + "px";


menu.style.left =
(e.clientX - 200) + "px";

}
async function addToOtherAlbum(){


document.getElementById("photoMenu").style.display =
"none";


const response =
await fetch(
workerURL + "?albums=true"
);


const albums =
await response.json();


const list =
document.getElementById("albumList");


list.innerHTML = "";


albums.forEach(item => {


if(item.name === album){

return;

}


const button =
document.createElement("button");


button.innerHTML =
item.name;


button.onclick = function(){

copyPhotoToAlbum(item.name);

};


list.appendChild(button);


});


const picker =
document.getElementById("albumPicker");


picker.style.display="flex";
picker.style.position="fixed";

picker.style.top="100px";

picker.style.left="50%";

picker.style.transform="translateX(-50%)";


}



async function copyPhotoToAlbum(destination){


const password =
localStorage.getItem("annaEditorPassword");


await fetch(
workerURL + "/copy",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({

source:currentPhoto,

destination:destination

})

}
);


closeAlbumPicker();


showSnackbar(
t(
"Photo added to " + destination,
"照片已添加到 " + destination
));

}
  function closeAlbumPicker(){

document.getElementById("albumPicker").style.display="none";

}
  function t(en, zh){

return language === "zh"
?
zh
:
en;

}
 function showSnackbar(message){

const bar =
document.getElementById("snackbar");

bar.innerHTML =
message;

bar.classList.add("show");

setTimeout(function(){

bar.classList.remove("show");

},3000);

}
  let confirmAction = null;


function showConfirm(message, action){

document.getElementById("confirmText").innerHTML =
message;

confirmAction = action;

document.getElementById("confirmBox").style.display =
"flex";

}


function confirmYes(){

document.getElementById("confirmBox").style.display =
"none";


if(confirmAction){

confirmAction();

}


confirmAction = null;

}



function confirmNo(){

document.getElementById("confirmBox").style.display =
"none";


confirmAction = null;

}

function photoClicked(photo){

if(selectingCover){

setCover(photo);

selectingCover=false;

document.body.classList.remove("cover-mode");

showSnackbar("Album cover changed");

return;

}

openLightbox(photo);

}

function openLightbox(photo){


currentPhoto = photo;


currentIndex =
lightboxPhotos.indexOf(photo);


showLightboxPhoto();


document.getElementById("lightbox").style.display =
"flex";


}



function showLightboxPhoto(){


const photo =
lightboxPhotos[currentIndex];


currentPhoto = photo;


const image =
"https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/" +
photo.split("/")
.map(encodeURIComponent)
.join("/");


document.getElementById("lightbox-image").src =
image;

loadCaption(photo);

}
async function loadCaption(photo){

const response =
await fetch(
workerURL +
"/get-caption?key=" +
encodeURIComponent(photo)
);


let data = {
english:"",
chinese:""
};

if(response.ok){

data =
await response.json();

}
currentCaption = data;


document.getElementById("captionEnglish").value =
data.english || "";


document.getElementById("captionChinese").value =
data.chinese || "";


updateCaptionCount();

}


function nextPhoto(){


if(currentIndex < lightboxPhotos.length - 1){

currentIndex++;

showLightboxPhoto();

}

}



function previousPhoto(){


if(currentIndex > 0){

currentIndex--;

showLightboxPhoto();

}

}



function closeLightbox(){


document.getElementById("lightbox").style.display =
"none";


currentPhoto = null;


}



function deleteLightboxPhoto(){

console.log("Delete clicked");
console.log("Current photo:", currentPhoto);


if(!currentPhoto){

showSnackbar(
t(
"No photo selected",
"未选择照片"
)
);
return;

}


showConfirm(
t(
"Delete this photo?",
"确定删除这张照片吗？"
),
  function(){

performDeletePhoto(currentPhoto);

closeLightbox();

}
);


}
document.addEventListener(
"click",
function(e){

const photoMenu =
document.getElementById("photoMenu");

const albumMenu =
document.getElementById("albumMenu");

if(
photoMenu &&
!photoMenu.contains(e.target)
){

photoMenu.style.display="none";

}


if(
albumMenu &&
!albumMenu.contains(e.target)
){

albumMenu.style.display="none";

}
});
  const dropOverlay =
document.getElementById("dropOverlay");


document.addEventListener(
"dragenter",
function(e){

e.preventDefault();

dropOverlay.style.display="flex";

}
);


document.addEventListener(
"dragover",
function(e){

e.preventDefault();

}
);


document.addEventListener(
"dragleave",
function(e){

if(e.clientX === 0 && e.clientY === 0){

dropOverlay.style.display="none";

}

}
);


document.addEventListener(
"drop",
function(e){

e.preventDefault();


dropOverlay.style.display="none";


const files =
e.dataTransfer.files;


if(files.length){

uploadFiles(files);

}

}
);  
  function applyEditorLanguage(){


document.getElementById("languageButton").textContent =
language === "zh"
?
"English"
:
"中文";


document.getElementById("albumsText").textContent =
language === "zh"
?
"相册"
:
"Albums";


document.getElementById("changeCoverText").textContent =
language === "zh"
?
"更换相册封面"
:
"Change Album Cover";


document.getElementById("renameAlbumText").textContent =
language === "zh"
?
"重命名相册"
:
"Rename Album";


document.getElementById("deleteAlbumText").textContent =
language === "zh"
?
"删除相册"
:
"Delete Album";


document.getElementById("saveCaptionText").textContent =
language === "zh"
?
"保存"
:
"Save";


document.getElementById("setCoverText").textContent =
language === "zh"
?
"设为相册封面"
:
"Set This Image as Album Cover";


document.getElementById("addOtherAlbumText").textContent =
language === "zh"
?
"添加到其他相册"
:
"Add to Other Album";


document.getElementById("downloadPhotoText").textContent =
language === "zh"
?
"下载照片"
:
"Download Photo";


document.getElementById("addAlbumTitleText").textContent =
language === "zh"
?
"添加到其他相册"
:
"Add to Other Album";


document.getElementById("cancelPickerText").textContent =
language === "zh"
?
"取消"
:
"Cancel";


document.getElementById("cancelUploadText").textContent =
language === "zh"
?
"取消上传"
:
"Cancel Upload";


}
  applyEditorLanguage();

  loadAlbumInfo();
loadPhotos();
function publicAlbumMenu(e){

e.preventDefault();
e.stopPropagation();


document.getElementById("publicText").innerHTML =
albumIsPublic
?
"This album is public"
:
"Do you want to set this album as public?";


document.querySelector(".public-yes").innerHTML =
albumIsPublic
?
"Set as private"
:
"Yes";


document.getElementById("publicBox").style.display="flex";

}



async function confirmPublicYes(){

await togglePublic(!albumIsPublic);

closePublicBox();


setTimeout(()=>{

location.reload();

},500);

}



function closePublicBox(){

document.getElementById("publicBox").style.display="none";

}



async function togglePublic(value){

const password =
localStorage.getItem("annaEditorPassword");


await fetch(
workerURL + "/set-public",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({

album:album,

public:value

})

}
);

}
  async function saveCaption(){

const english =
document.getElementById("captionEnglish")
.value.trim();


const chinese =
document.getElementById("captionChinese")
.value.trim();
if(
(english && !chinese) ||
(!english && chinese)
){

showSnackbar(
t(
"Please enter both English and Chinese captions, or leave both empty.",
"请输入英文和中文说明，或者两者都留空。"
));

return;

}

const password =
localStorage.getItem("annaEditorPassword");


await fetch(
workerURL + "/save-caption",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({

key:currentPhoto,

english:english,

chinese:chinese

})

}
);


showSnackbar(
t(
"Caption saved",
"说明已保存"
)
);
}
function downloadPhoto(){

    if(!currentPhoto){

showSnackbar(
t(
"No photo selected",
"未选择照片"
)
);
        return;

    }


    const url =
    workerURL +
    "/download?key=" +
    encodeURIComponent(currentPhoto);


    const link = document.createElement("a");

    link.href = url;

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);


showSnackbar(
t(
"Downloading photo",
"正在下载照片"
)
);
}function updateCaptionCount(){

const english =
document.getElementById("captionEnglish");

const chinese =
document.getElementById("captionChinese");


document.getElementById("englishCount").innerHTML =
english.value.length +
" / " +
ENGLISH_CAPTION_LIMIT;


document.getElementById("chineseCount").innerHTML =
chinese.value.length +
" / " +
CHINESE_CAPTION_LIMIT;

}
  document
.getElementById("captionEnglish")
.addEventListener(
"input",
updateCaptionCount
);


document
.getElementById("captionChinese")
.addEventListener(
"input",
updateCaptionCount
);
</script>
<footer class="site-footer">
    © <span id="year"></span> Anna Deng Photography
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>

</html>
