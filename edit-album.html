<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Edit Album</title>
<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>Anna Deng Photography</h1>

<div class="editor-topbar">

<a href="editor.html" class="editor-back">

<img src="icons/back.png">

<span>Albums</span>

</a>


<div class="editor-actions">

<label class="icon-button">

<img src="icons/add-photo.png">

<input
type="file"
id="files"
multiple
hidden
onchange="uploadPhotos()">

</label>


<button
class="menu-button"
onclick="toggleAlbumMenu(event)">

&#8942;

</button>

</div>

</div>


<h2 id="title"></h2>


<div
id="albumMenu"
class="popup-menu">

<button
onclick="startCoverSelection()">

Set Album Cover...

</button>

<button
onclick="renameAlbum()">

Rename Album

</button>

<button
onclick="deleteAlbum()">

Delete Album

</button>

</div>


<div id="photos" class="albums"></div>
  <div id="lightbox" class="lightbox">

<button
class="lightbox-close"
onclick="closeLightbox()">

&times;


</button>


<button
class="lightbox-prev"
onclick="previousPhoto()">

&#8249;

</button>


<button
class="lightbox-next"
onclick="nextPhoto()">

&#8250;

</button>

<img
id="lightbox-image">


<div class="lightbox-actions">


<button
class="icon-control"
onclick="deleteLightboxPhoto()">

<img src="icons/trash.png">

</button>


<button
class="menu-button"
onclick="photoMenu(event, currentPhoto)">

&#8942;

</button>


</div>

</div>

 <div
id="photoMenu"
class="popup-menu">

<button
onclick="addToOtherAlbum()">

Add to Other Album

</button>

</div>


<div id="albumPicker" class="album-picker-overlay">

<div class="album-picker-box">

<h2>Add to Other Album</h2>

<div id="albumList"></div>

<button onclick="closeAlbumPicker()">
Cancel
</button>

</div>

</div>
  <div id="snackbar"></div>


<script>
const password =
localStorage.getItem("annaEditorPassword");

if (!password) {

window.location.href =
"manage.html";

}

const workerURL =
"https://anna-photo-gallery.anna-deng.workers.dev";


const params =
new URLSearchParams(location.search);


const album =
params.get("album");


document.getElementById("title").innerHTML =
album;



async function loadPhotos(){


const response =
await fetch(
workerURL +
"?album=" +
encodeURIComponent(album)
);


const photos =
await response.json();
  lightboxPhotos = photos;


const container =
document.getElementById("photos");


photos.forEach(photo => {


const div =
document.createElement("div");


div.className =
"editor-photo";

const image =
"https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/" +
photo.split("/")
.map(encodeURIComponent)
.join("/");



div.innerHTML = `

<div class="photo-wrapper">

<img
src="${image}"
onclick="openLightbox('${photo}')">
<div class="photo-toolbar">

<button
class="icon-control"
onclick="deletePhoto('${photo}')">

<img src="icons/trash.png">

</button>

<button
class="menu-button photo-menu-button"
onclick="photoMenu(event,'${photo}')">

&#8942;

</button>

</div>

</div>

`;

container.appendChild(div);


});


}

async function deletePhoto(key){


if(!confirm("Delete this photo?")){

return;

}


const password =
localStorage.getItem("annaEditorPassword");


await fetch(
workerURL + "/delete",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({
key:key
})

}
);


location.reload();


}
  async function setCover(key){


const password =
localStorage.getItem("annaEditorPassword");


await fetch(
workerURL + "/set-cover",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({
key:key
})

}
);


alert("Cover updated");


}
  async function uploadPhotos(){


const password =
localStorage.getItem("annaEditorPassword");


const files =
document.getElementById("files").files;


for (const file of files){


const form =
new FormData();


form.append(
"album",
album
);


form.append(
"file",
file
);



await fetch(
workerURL + "/upload",
{
method:"POST",

headers:{
"X-Upload-Password":password
},

body:form

}
);


}


alert(
"Photos uploaded!"
);


location.reload();


}

function toggleAlbumMenu(e){

}

function startCoverSelection(){

}

function renameAlbum(){

}

function deleteAlbum(){

}
function photoMenu(e,key){

e.stopPropagation();


currentPhoto = key;


const menu =
document.getElementById("photoMenu");


menu.style.display="block";


menu.style.position="fixed";


menu.style.top =
(e.clientY + 10) + "px";


menu.style.left =
(e.clientX - 200) + "px";

}



async function addToOtherAlbum(){


document.getElementById("photoMenu").style.display =
"none";


const response =
await fetch(
workerURL + "?albums=true"
);


const albums =
await response.json();


const list =
document.getElementById("albumList");


list.innerHTML = "";


albums.forEach(item => {


if(item.name === album){

return;

}


const button =
document.createElement("button");


button.innerHTML =
item.name;


button.onclick = function(){

copyPhotoToAlbum(item.name);

};


list.appendChild(button);


});


const picker =
document.getElementById("albumPicker");


picker.style.display="flex";
picker.style.position="fixed";

picker.style.top="100px";

picker.style.left="50%";

picker.style.transform="translateX(-50%)";


}



async function copyPhotoToAlbum(destination){


const password =
localStorage.getItem("annaEditorPassword");


await fetch(
workerURL + "/copy",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({

source:currentPhoto,

destination:destination

})

}
);


closeAlbumPicker();


showSnackbar(
"Photo added to " + destination
);

}
  function closeAlbumPicker(){

document.getElementById("albumPicker").style.display="none";

}
  function showSnackbar(message){

const bar =
document.getElementById("snackbar");


bar.innerHTML =
message;


bar.className="show";


setTimeout(()=>{

bar.className="";

},3000);

}
  let currentPhoto = null;
  let lightboxPhotos = [];

let currentIndex = 0;


function openLightbox(photo){


currentPhoto = photo;


currentIndex =
lightboxPhotos.indexOf(photo);


showLightboxPhoto();


document.getElementById("lightbox").style.display =
"flex";


}



function showLightboxPhoto(){


const photo =
lightboxPhotos[currentIndex];


currentPhoto = photo;


const image =
"https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/" +
photo.split("/")
.map(encodeURIComponent)
.join("/");


document.getElementById("lightbox-image").src =
image;


}



function nextPhoto(){


if(currentIndex < lightboxPhotos.length - 1){

currentIndex++;

showLightboxPhoto();

}

}



function previousPhoto(){


if(currentIndex > 0){

currentIndex--;

showLightboxPhoto();

}

}



function closeLightbox(){


document.getElementById("lightbox").style.display =
"none";


currentPhoto = null;


}



function deleteLightboxPhoto(){


if(currentPhoto){

deletePhoto(currentPhoto);

closeLightbox();

}


}
 document.addEventListener(
"click",
function(e){

const menu =
document.getElementById("photoMenu");


if(
!menu.contains(e.target)
){

menu.style.display="none";

}

}
);
  
loadPhotos();


</script>


</body>

</html>
