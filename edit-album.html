<!DOCTYPE html>
<html>

<head>

<title>Edit Album</title>
<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>Anna Deng Photography</h1>

<div class="editor-topbar">

<a href="editor.html" class="editor-back">

<img src="icons/back.png">

<span>Albums</span>

</a>


<div class="editor-actions">

<label class="icon-button">

<img src="icons/add-photo.png">

<input
type="file"
id="files"
multiple
hidden
onchange="uploadPhotos()">

</label>


<button
class="menu-button"
onclick="toggleAlbumMenu(event)">

&#8942;

</button>

</div>

</div>


<h2 id="title"></h2>


<div
id="albumMenu"
class="popup-menu">

<button
onclick="startCoverSelection()">

Set Album Cover...

</button>

<button
onclick="renameAlbum()">

Rename Album

</button>

<button
onclick="deleteAlbum()">

Delete Album

</button>

</div>


<div id="photos" class="albums"></div>

  <div
id="photoMenu"
class="popup-menu">

<button
onclick="addToOtherAlbum()">

Add to Other Album

</button>

</div>

<script>
const password =
localStorage.getItem("annaEditorPassword");

if (!password) {

window.location.href =
"manage.html";

}

const workerURL =
"https://anna-photo-gallery.anna-deng.workers.dev";


const params =
new URLSearchParams(location.search);


const album =
params.get("album");


document.getElementById("title").innerHTML =
album;



async function loadPhotos(){


const response =
await fetch(
workerURL +
"?album=" +
encodeURIComponent(album)
);


const photos =
await response.json();


const container =
document.getElementById("photos");


photos.forEach(photo => {


const div =
document.createElement("div");


div.className =
"editor-photo";

const image =
"https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/" +
photo.split("/")
.map(encodeURIComponent)
.join("/");



div.innerHTML = `

<div class="photo-wrapper">

<img src="${image}">

<div class="photo-toolbar">

<button
class="icon-control"
onclick="deletePhoto('${photo}')">

<img src="icons/trash.png">

</button>

<button
class="menu-button photo-menu-button"
onclick="photoMenu(event,'${photo}')">

&#8942;

</button>

</div>

</div>

`;

container.appendChild(div);


});


}

async function deletePhoto(key){


if(!confirm("Delete this photo?")){

return;

}


const password =
localStorage.getItem("annaEditorPassword");


await fetch(
workerURL + "/delete",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({
key:key
})

}
);


location.reload();


}
  async function setCover(key){


const password =
localStorage.getItem("annaEditorPassword");


await fetch(
workerURL + "/set-cover",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({
key:key
})

}
);


alert("Cover updated");


}
  async function uploadPhotos(){


const password =
localStorage.getItem("annaEditorPassword");


const files =
document.getElementById("files").files;


for (const file of files){


const form =
new FormData();


form.append(
"album",
album
);


form.append(
"file",
file
);



await fetch(
workerURL + "/upload",
{
method:"POST",

headers:{
"X-Upload-Password":password
},

body:form

}
);


}


alert(
"Photos uploaded!"
);


location.reload();


}

function toggleAlbumMenu(e){

}

function startCoverSelection(){

}

function renameAlbum(){

}

function deleteAlbum(){

}
  function photoMenu(e,key){

}

function addToOtherAlbum(){

}
  
loadPhotos();


</script>


</body>

</html>
