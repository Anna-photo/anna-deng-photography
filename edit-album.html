<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Edit Album</title>
<link rel="stylesheet" href="style.css">

</head>


<body>


<img class="anna-logo" src="icons/anna-logo.png" alt="Anna Deng Photography">
<div class="editor-topbar">

<a href="editor.html" class="editor-back">

<img src="icons/back.png">

<span>Albums</span>

</a>


<div class="editor-actions">

<label class="icon-button">

<img src="icons/add-photo.png">

<input
type="file"
id="files"
multiple
hidden
onchange="uploadPhotos()">

</label><button
class="menu-button"
onclick="toggleAlbumMenu(event)">

&#8942;

</button>

</div>

</div>


<h2 id="title"></h2>


<div
id="albumMenu"
class="popup-menu">

<button
onclick="startCoverSelection()">

Set Album Cover...

</button>

<button
onclick="renameAlbum()">

Rename Album

</button>

<button
onclick="deleteAlbum()">

Delete Album

</button>

</div>


<div id="photos" class="albums"></div>
  <div id="lightbox" class="lightbox">

<button
class="lightbox-close"
onclick="closeLightbox()">

&times;


</button>


<button
class="lightbox-prev"
onclick="previousPhoto()">

&#8249;

</button>


<button
class="lightbox-next"
onclick="nextPhoto()">

&#8250;

</button>

<img
id="lightbox-image">


<div class="lightbox-actions">


<button
class="icon-control"
onclick="deleteLightboxPhoto()">

<img src="icons/trash.png">

</button>


<button
class="menu-button"
onclick="photoMenu(event, currentPhoto)">

&#8942;

</button>


</div>

</div>

 <div
id="photoMenu"
class="popup-menu">

<button
onclick="addToOtherAlbum()">

Add to Other Album

</button>

</div>

<div id="galleryPhotoMenu" class="popup-menu">

<button onclick="gallerySetCover()">
Set Album Cover
</button>

<button onclick="renameAlbum()">
Rename Album
</button>

<button onclick="deleteAlbum()">
Delete Album
</button>

</div>
<div id="albumPicker" class="album-picker-overlay">

<div class="album-picker-box">

<h2>Add to Other Album</h2>

<div id="albumList"></div>

<button onclick="closeAlbumPicker()">
Cancel
</button>

</div>

</div>
  <div id="snackbar"></div>
  <div id="uploadStatus" class="upload-status">

<h3 id="uploadTitle">Uploading images</h3>

<p id="uploadProgress">
0 of 0
</p>

<button onclick="cancelUpload()">
Cancel Upload
</button>

</div>
  <div id="confirmBox" class="confirm-overlay">

<div class="confirm-dialog">

<h3 id="confirmText"></h3>

<div class="confirm-buttons">

<button onclick="confirmYes()">
Delete
</button>

<button onclick="confirmNo()">
Cancel
</button>

</div>

</div>

</div>
<div id="dropOverlay">

<div class="drop-message">

<div class="arrow">↑</div>

<p>Drop photo anywhere to upload.</p>

</div>

</div>

<script>
const password =
localStorage.getItem("annaEditorPassword");

if (!password) {

window.location.href =
"manage.html";

}

const workerURL =
"https://anna-photo-gallery.anna-deng.workers.dev";


const params =
new URLSearchParams(location.search);


const album =
params.get("album");


document.getElementById("title").innerHTML =
album;



async function loadPhotos(){


const response =
await fetch(
workerURL +
"?album=" +
encodeURIComponent(album)
);


const photos =
await response.json();
  lightboxPhotos = photos;


const container =
document.getElementById("photos");
if(photos.length === 0){

const container =
document.getElementById("photos");

container.innerHTML = `

<div class="empty-album-message">

<h2>This album is empty.</h2>

<p>Add photos to get started.</p>

</div>

`;

return;

}

photos.forEach(photo => {


const div =
document.createElement("div");


div.className =
"editor-photo";

const image =
"https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/" +
photo.split("/")
.map(encodeURIComponent)
.join("/");



div.innerHTML = `

<div class="photo-wrapper">

<img
src="${image}"
onclick="openLightbox('${photo}')">
<div class="photo-toolbar">

<button
class="icon-control"
onclick="performDeletePhoto('${photo}')"
<img src="icons/trash.png">

</button>

<button
class="menu-button photo-menu-button"
onclick="galleryMenu(event,'${photo}')">

&#8942;

</button>

</div>

</div>

`;

container.appendChild(div);


});


}

async function performDeletePhoto(key){

const password =
localStorage.getItem("annaEditorPassword");


await fetch(
workerURL + "/delete",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({
key:key
})

}
);


showSnackbar("Photo deleted");


setTimeout(()=>{

location.reload();

},800);

}
  async function setCover(key){


const password =
localStorage.getItem("annaEditorPassword");


await fetch(
workerURL + "/set-cover",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({
key:key
})

}
);


showSnackbar(
"Cover updated"
);

}
  async function uploadPhotos(){


const password =
localStorage.getItem("annaEditorPassword");


const files =
document.getElementById("files").files;


for (const file of files){


const form =
new FormData();


form.append(
"album",
album
);


form.append(
"file",
file
);



await fetch(
workerURL + "/upload",
{
method:"POST",

headers:{
"X-Upload-Password":password
},

body:form

}
);


}


showSnackbar(
"Photos uploaded!"
);

location.reload();


}
let uploadCancelled = false;


async function uploadFiles(files){


uploadCancelled = false;


const total =
files.length;


const status =
document.getElementById("uploadStatus");


const title =
document.getElementById("uploadTitle");


const progress =
document.getElementById("uploadProgress");


status.style.display="block";


title.innerHTML =
total === 1
? "Uploading image"
: "Uploading images";


progress.innerHTML =
"0 of " + total;



const password =
localStorage.getItem("annaEditorPassword");


let completed = 0;


for(const file of files){


if(uploadCancelled){

break;

}



const form =
new FormData();


form.append(
"album",
album
);


form.append(
"file",
file
);



await fetch(
workerURL + "/upload",
{
method:"POST",

headers:{
"X-Upload-Password":password
},

body:form

}
);



completed++;


progress.innerHTML =
completed +
" of " +
total;


}



if(uploadCancelled){

showSnackbar("Upload cancelled");

}
else{

showSnackbar("Upload complete");

setTimeout(()=>{

location.reload();

},800);

}


status.style.display="none";


}
  function cancelUpload(){

uploadCancelled = true;

}
  function toggleAlbumMenu(e){

}

function startCoverSelection(){

}

function renameAlbum(){

}

function deleteAlbum(){

}
function photoMenu(e,key){

e.stopPropagation();


currentPhoto = key;


const menu =
document.getElementById("photoMenu");


menu.style.display="block";


menu.style.position="fixed";


menu.style.top =
(e.clientY + 10) + "px";


menu.style.left =
(e.clientX - 200) + "px";

}
function galleryMenu(e,key){

e.stopPropagation();

currentPhoto = key;

const menu =
document.getElementById("galleryPhotoMenu");

menu.style.display="block";

menu.style.position="fixed";

menu.style.top =
(e.clientY + 10) + "px";

menu.style.left =
(e.clientX - 200) + "px";

}

function gallerySetCover(){

setCover(currentPhoto);

document.getElementById("galleryPhotoMenu").style.display="none";

}
async function addToOtherAlbum(){


document.getElementById("photoMenu").style.display =
"none";


const response =
await fetch(
workerURL + "?albums=true"
);


const albums =
await response.json();


const list =
document.getElementById("albumList");


list.innerHTML = "";


albums.forEach(item => {


if(item.name === album){

return;

}


const button =
document.createElement("button");


button.innerHTML =
item.name;


button.onclick = function(){

copyPhotoToAlbum(item.name);

};


list.appendChild(button);


});


const picker =
document.getElementById("albumPicker");


picker.style.display="flex";
picker.style.position="fixed";

picker.style.top="100px";

picker.style.left="50%";

picker.style.transform="translateX(-50%)";


}



async function copyPhotoToAlbum(destination){


const password =
localStorage.getItem("annaEditorPassword");


await fetch(
workerURL + "/copy",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"X-Upload-Password":password
},

body:JSON.stringify({

source:currentPhoto,

destination:destination

})

}
);


closeAlbumPicker();


showSnackbar(
"Photo added to " + destination
);

}
  function closeAlbumPicker(){

document.getElementById("albumPicker").style.display="none";

}
 function showSnackbar(message){

const bar =
document.getElementById("snackbar");

bar.innerHTML =
message;

bar.classList.add("show");

setTimeout(function(){

bar.classList.remove("show");

},3000);

}
  let confirmAction = null;


function showConfirm(message, action){

document.getElementById("confirmText").innerHTML =
message;

confirmAction = action;

document.getElementById("confirmBox").style.display =
"flex";

}


function confirmYes(){

document.getElementById("confirmBox").style.display =
"none";


if(confirmAction){

confirmAction();

}


confirmAction = null;

}



function confirmNo(){

document.getElementById("confirmBox").style.display =
"none";


confirmAction = null;

}
  let currentPhoto = null;
  let lightboxPhotos = [];

let currentIndex = 0;


function openLightbox(photo){


currentPhoto = photo;


currentIndex =
lightboxPhotos.indexOf(photo);


showLightboxPhoto();


document.getElementById("lightbox").style.display =
"flex";


}



function showLightboxPhoto(){


const photo =
lightboxPhotos[currentIndex];


currentPhoto = photo;


const image =
"https://pub-01c7ea2201024931a9deb0945513816e.r2.dev/" +
photo.split("/")
.map(encodeURIComponent)
.join("/");


document.getElementById("lightbox-image").src =
image;


}



function nextPhoto(){


if(currentIndex < lightboxPhotos.length - 1){

currentIndex++;

showLightboxPhoto();

}

}



function previousPhoto(){


if(currentIndex > 0){

currentIndex--;

showLightboxPhoto();

}

}



function closeLightbox(){


document.getElementById("lightbox").style.display =
"none";


currentPhoto = null;


}



function deleteLightboxPhoto(){

console.log("Delete clicked");
console.log("Current photo:", currentPhoto);


if(!currentPhoto){

showSnackbar("No photo selected");

return;

}


showConfirm(
"Delete this photo?",
function(){

performDeletePhoto(currentPhoto);

closeLightbox();

}
);


}
document.addEventListener(
"click",
function(e){

const photoMenu =
document.getElementById("photoMenu");

const galleryMenu =
document.getElementById("galleryPhotoMenu");


if(
photoMenu &&
!photoMenu.contains(e.target)
){

photoMenu.style.display="none";

}


if(
galleryMenu &&
!galleryMenu.contains(e.target)
){

galleryMenu.style.display="none";

}

});
  const dropOverlay =
document.getElementById("dropOverlay");


document.addEventListener(
"dragenter",
function(e){

e.preventDefault();

dropOverlay.style.display="flex";

}
);


document.addEventListener(
"dragover",
function(e){

e.preventDefault();

}
);


document.addEventListener(
"dragleave",
function(e){

if(e.clientX === 0 && e.clientY === 0){

dropOverlay.style.display="none";

}

}
);


document.addEventListener(
"drop",
function(e){

e.preventDefault();


dropOverlay.style.display="none";


const files =
e.dataTransfer.files;


if(files.length){

uploadFiles(files);

}

}
);  loadPhotos();


</script>


</body>

</html>
