<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

<title>Anna Editor Login</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="favicon-black.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="favicon-gray.png" media="(prefers-color-scheme: dark)">
</head>


<body>


<img class="anna-logo" src="icons/anna-logo.png" alt="Anna Deng Photography">
    <button id="languageButton" onclick="toggleLanguage()">
中文
</button>

<h2 id="loginTitle">
Editor Login
</h2>

<label id="usernameLabel">
Username:
<input type="text" id="username">
</label>

<br><br>

<label id="passwordLabel">
Password:
<input type="password" id="password">
</label>

<br><br>


<button onclick="login()" id="loginButton">
Login
</button>

<p id="message"></p>



<script>


const workerURL =
"https://anna-photo-gallery.anna-deng.workers.dev";

const language =
localStorage.getItem("language") || "en";


function toggleLanguage(){

localStorage.setItem(
"language",
language === "en" ? "zh" : "en"
);

location.reload();

}


function applyManageLanguage(){

document.getElementById("languageButton").textContent =
language === "zh"
?
"English"
:
"中文";


document.getElementById("loginTitle").textContent =
language === "zh"
?
"编辑器登录"
:
"Editor Login";

document.getElementById("usernameLabel").childNodes[0].textContent =
language === "zh"
?
"用户名："
:
"Username:";
document.getElementById("passwordLabel").childNodes[0].textContent =
language === "zh"
?
"密码："
:
"Password:";


document.getElementById("loginButton").textContent =
language === "zh"
?
"登录"
:
"Login";

}

applyManageLanguage();

async function login(){


const username =
document.getElementById("username").value;


const password =
document.getElementById("password").value;



const response =
await fetch(
workerURL +
"/login?username=" +
encodeURIComponent(username) +
"&password=" +
encodeURIComponent(password)
);

const result =
await response.json();



if(result.success){


localStorage.setItem(
"annaEditorUsername",
username
);


localStorage.setItem(
"annaEditorPassword",
password
);


window.location.href =
"editor.html";


}

else {

document.getElementById("message").innerHTML =
language === "zh"
?
"用户名或密码错误"
    :
"Wrong password";
}


}


</script>


</body>
<footer class="site-footer">
    © <span id="year"></span> Anna Deng Photography
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
</script>
</html>
