<!DOCTYPE html>
<html>

<head>

<title>Anna Editor Login</title>
<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>Anna Deng Photography</h1>

<h2>Editor Login</h2>


<label>
Password:
<input type="password" id="password">
</label>


<br><br>


<button onclick="login()">
Login
</button>


<p id="message"></p>



<script>


const workerURL =
"https://anna-photo-gallery.anna-deng.workers.dev";



async function login(){


const password =
document.getElementById("password").value;



const response =
await fetch(
workerURL +
"/login?password=" +
encodeURIComponent(password)
);



const result =
await response.json();



if(result.success){


localStorage.setItem(
"annaEditorPassword",
password
);



window.location.href =
"editor.html";


}

else {

document.getElementById("message").innerHTML =
"Wrong password";

}


}


</script>


</body>

</html>
